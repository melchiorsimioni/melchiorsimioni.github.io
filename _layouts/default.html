<!doctype html>
<html lang="{{ site.lang | default: 'fr-FR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&amp;family=Source+Serif+4:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <meta name="google-site-verification" content="9HUeYVBDxF5cehYIpIK28VBbm3VqnPKdzhqbFgWV-NM">
    {% seo %}
  </head>
  <body>
    <div id="container">
      <div class="inner">
        <nav class="site-nav" aria-label="Navigation principale">
          <a class="site-nav-home" href="{{ '/' | relative_url }}">Melchior Simioni</a>
          <div class="site-nav-menu">
            <input class="site-nav-toggle" type="checkbox" id="site-nav-toggle">
            <label class="site-nav-toggle-label" for="site-nav-toggle">
              <span class="site-nav-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
              <span class="visually-hidden">Ouvrir ou fermer le menu</span>
            </label>
            <div class="site-nav-links">
              <a href="{{ '/publications' | relative_url }}">Publications</a>
              <a href="{{ '/teaching' | relative_url }}">Enseignements</a>
              <a href="{{ '/varia' | relative_url }}">Varia</a>
            </div>
          </div>
        </nav>
        {% if site.github.public %}
        <a href="{% if site.github.is_project_page %}{{ site.github.repository_url }}{% else %}{{ site.github.owner_url }}{% endif %}" class="button">View on GitHub</a>
        {% endif %}
        <hr>
        <main id="main_content">{{ content }}</main>
        {% include footer.html %}
      </div>
    </div>
  </body>
</html>
