<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    {% seo %}
    {% include head-custom.html %}
  </head>
  <body>
    <div id="container">
      <div class="inner">
        <nav class="site-nav" aria-label="Navigation principale">
          <a class="site-nav-home" href="{{ '/' | relative_url }}">Melchior Simioni</a>
          <details class="site-nav-menu">
            <summary>
              <span class="site-nav-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
              <span class="visually-hidden">Ouvrir ou fermer le menu</span>
            </summary>
            <div class="site-nav-links">
              <a href="{{ '/publications' | relative_url }}">Publications</a>
              <a href="{{ '/teaching' | relative_url }}">Enseignements</a>
              <a href="{{ '/varia' | relative_url }}">Varia</a>
            </div>
          </details>
        </nav>
        {% if site.show_downloads %}
        <a href="{{ site.github.zip_url }}" class="button">Download .zip</a>
        <a href="{{ site.github.tar_url }}" class="button">Download .tar.gz</a>
        {% endif %}
        {% if site.github.public %}
        <a href="{% if site.github.is_project_page %}{{ site.github.repository_url }}{% else %}{{ site.github.owner_url }}{% endif %}" class="button">View on GitHub</a>
        {% endif %}
        <hr>
        <main id="main_content">{{ content }}</main>
        {% include footer.html %}
      </div>
    </div>
  </body>
</html>
